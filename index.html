<!DOCTYPE html>
<html lang="en">

<head>
    <title>Visor de les Escoles d'Educació Infantil de 1er Cicle de Catalunya 2025</title>
    <meta property="og:description" content="Draw points from a GeoJSON collection to a map." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.4.0/dist/maplibre-gl.css' />
    <link rel="stylesheet" href="style.css">
    <script src='https://unpkg.com/maplibre-gl@5.4.0/dist/maplibre-gl.js'></script>

</head>

<body>
    <div id="map"></div>
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style:
                'https://api.maptiler.com/maps/positron/style.json?key=get_your_own_OpIi9ZULNHzrESv6T2vL',
            center: [0, 0],
            zoom: 1
        });

        map.on('load', async () => {
            // Add an image to use as a custom marker
            // const image = await map.loadImage('https://maplibre.org/maplibre-gl-js/docs/assets/osgeo-logo.png');
            // map.addImage('custom-marker', image.data);
            // Add a GeoJSON source with 15 points
            map.addSource('escoles', {
                'type': 'geojson',
                'data': './geojson/Escoles_Infantil_0_3.geojson'
            });

            map.addLayer({
                'id': 'escoles',
                'type': 'circle',
                'source': 'escoles',
                'paint': {
                    // Color segons la titularitat
                    'circle-color': [
                        'match',
                        ['get', 'Nom_naturalesa'],
                        'Públic', '#2ca51b',
                        'Privat', '#ff6e1e',
      /* default */ '#cccccc'
                    ],
                    'circle-radius': 6,
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 1
                }
            });
        });
    </script>
</body>

</html>
